<!DOCTYPE html>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>

<body>
  <div id="app">
    <aside id="sidebar" class="hidden">
      <div class="sidebar-head">
        <span>资料复习</span>
        <button id="sidebar-close" title="收起">✕</button>
      </div>
      <div id="sidebar-tree"></div>
      <div id="sidebar-resizer" title="拖动调整宽度"></div>
    </aside>
    <div id="main">
      <header id="topbar">
        <button id="btn-menu" title="菜单">☰</button>
        <button id="btn-back" class="hidden" aria-label="返回"></button>
        <h1 id="page-title">背诵</h1>
        <div id="topbar-actions">
          <div id="topbar-dynamic" style="display: flex; gap: 6px; align-items: center;"></div>
          <button id="btn-more" class="btn btn-sm btn-ghost" title="更多">⋮</button>
        </div>
      </header>
      <main id="view"
        style="flex: 1; height: 100%; overflow-y: auto !important; -webkit-overflow-scrolling: touch; padding: 16px; display: block;">
      </main>
    </div>
  </div>
  <div id="toast-root"></div>

  <!-- ================= 核心依赖库引入 ================= -->

  <!-- 1. PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <!-- 2. pdf-lib -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

  <!-- 3. Tesseract.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>

  <!-- 4. JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- 5. Mammoth -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>

  <!-- 6. jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- 7. html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- 8. html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- 9. html-docx (导出 Word 备用源加载) -->
  <script src="https://unpkg.com/html-docx-js@0.1.0/dist/html-docx.js"></script>
  <script>
    (function () {
      if (window.htmlDocx) return;
      var chain = [
        'https://cdn.jsdelivr.net/npm/html-docx-js@0.1.0/dist/html-docx.js',
        './vendor/html-docx/html-docx.js'
      ];
      var i = 0;
      function next() {
        if (i >= chain.length) return;
        var s = document.createElement('script');
        s.src = chain[i++];
        s.onerror = next;
        s.onload = function () { if (!window.htmlDocx) next(); };
        document.head.appendChild(s);
      }
      next();
    })();
  </script>

  <!-- 10. KaTeX -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

  <!-- ================= 项目主程序入口 ================= -->
  <script type="module" src="./src/main.js"></script>

  <!-- PWA Service Worker 注册 -->
  <script>
    (function () {
      const isSecure = window.isSecureContext;
      if (!isSecure) {
        window.__swDisabled = true;
      }
      if (!('serviceWorker' in navigator)) return;
      
      // 默认关闭 Service Worker（若需开启离线缓存，可注释掉下面这一行 return）
      if (true) return; 

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          if (reg.waiting) {
            const bar = document.createElement('div');
            bar.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1D3557;color:#fff;padding:10px 16px;border-radius:10px;z-index:999998;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)';
            bar.innerHTML = '<span>发现新版本</span>';
            const btn = document.createElement('button');
            btn.textContent = '立即刷新';
            btn.className = 'btn btn-sm';
            btn.onclick = () => {
              if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
              else location.reload();
            };
            bar.appendChild(btn);
            document.body.appendChild(bar);
          }
        }).catch(err => { });
      });
    })();
  </script>

</body>

</html>
