<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAFB" />
  <title>资料复习</title>
  <link rel="stylesheet" href="./assets/styles/main.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="hidden">
      <div class="sidebar-head">
        <span>资料复习</span>
        <button id="sidebar-close" title="收起">✕</button>
      </div>
      <div id="sidebar-tree"></div>
      <div id="sidebar-resizer" title="拖动调整宽度"></div>
    </aside>
    <div id="main">
      <header id="topbar">
        <button id="btn-menu" title="菜单">☰</button>
        <button id="btn-back" class="hidden" aria-label="返回"></button>
        <h1 id="page-title">背诵</h1>
        <div id="topbar-actions">
          <button id="btn-search" class="btn btn-sm btn-ghost" title="搜索">🔍</button>
          <button id="btn-inbox" class="btn btn-sm btn-ghost" title="速记">📥</button>
          <button id="btn-pomo" class="btn btn-sm btn-ghost" title="番茄钟">⏱</button>
          <button id="btn-help" class="btn btn-sm btn-ghost" title="帮助">❓</button>
          <button id="btn-trash" class="btn btn-sm btn-ghost" title="回收站">🗑</button>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <nav id="bottombar">
    <a href="#/" data-tab="home">背诵</a>
    <a href="#/review" data-tab="review">复习</a>
    <a href="#/search" data-tab="search">搜索</a>
    <a href="#/settings" data-tab="settings">设置</a>
  </nav>
  <div id="toast-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    window.pdfjsLib = window['pdfjs-dist/build/pdf'];
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
