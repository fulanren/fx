<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <!-- 锁定屏幕缩放，开启全屏沉浸 -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAFB" />

  <!-- 👇 核心 PWA 配置 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="资料复习">

  <!-- 👇 苹果专属图标 -->
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">

  <title>资料复习</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./assets/styles/main.css" />
</head>

<body>
  <div id="app">
    <aside id="sidebar" class="hidden">
      <div class="sidebar-head">
        <span>资料复习</span>
        <button id="sidebar-close" title="收起">✕</button>
      </div>
      <div id="sidebar-tree"></div>
      <div id="sidebar-resizer" title="拖动调整宽度"></div>
    </aside>
    <div id="main">
      <header id="topbar">
        <button id="btn-menu" title="菜单">☰</button>
        <button id="btn-back" class="hidden" aria-label="返回"></button>
        <h1 id="page-title">背诵</h1>
        <div id="topbar-actions">
          <div id="topbar-dynamic" style="display: flex; gap: 6px; align-items: center;"></div>
          <button id="btn-more" class="btn btn-sm btn-ghost" title="更多">⋮</button>
        </div>
      </header>
      <main id="view"
        style="flex: 1; height: 100%; overflow-y: auto !important; -webkit-overflow-scrolling: touch; padding: 16px; display: block;">
      </main>
    </div>
  </div>
  <div id="toast-root"></div>

  <!-- ================= 核心依赖库引入 ================= -->

  <!-- 1. PDF.js (PDF 阅读核心) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <!-- 2. pdf-lib (PDF 拆分、合并、插入) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

  <!-- 3. Tesseract.js (OCR 文字识别) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    // 👇 强制使用国内镜像下载中文语言包，防止卡死
    if (window.Tesseract) {
      window.Tesseract.workerOptions = {
        langPath: 'https://tessdata.projectnaptha.com/4.0.0', // 官方备用镜像
      };
    }
  </script>

  <!-- 4. JSZip (打包下载) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- 5. Mammoth (Word 文档解析) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <!-- 6. jsPDF (生成导出 PDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- 7. html2canvas (网页截图转 PDF 核心) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- ================= 项目主程序入口 ================= -->
  <script type="module" src="./src/main.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW注册失败:', err));
      });
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>

</body>

</html>
